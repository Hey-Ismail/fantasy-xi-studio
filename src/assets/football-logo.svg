<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Dream Football logo">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2f" />
      <stop offset="48%" stop-color="#13233f" />
      <stop offset="100%" stop-color="#0b101a" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22d3ee" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="8" y="8" width="744" height="244" rx="36" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="4" />

  <g transform="translate(42 42)" filter="url(#softGlow)">
    <rect x="0" y="0" width="176" height="176" rx="40" fill="#0f172a" stroke="#67e8f9" stroke-width="3" />
    <circle cx="88" cy="88" r="54" fill="#f8fafc" />
    <polygon points="88,56 106,68 100,88 76,88 70,68" fill="#0f172a" />
    <polygon points="62,94 76,88 82,108 68,122 50,112" fill="#0f172a" />
    <polygon points="114,94 100,88 94,108 108,122 126,112" fill="#0f172a" />
    <path d="M38 70 C56 48, 122 48, 140 70" fill="none" stroke="#84cc16" stroke-width="5" stroke-linecap="round" />
  </g>

  <text x="248" y="118" font-size="74" font-family="Trebuchet MS, Verdana, sans-serif" font-weight="700" fill="url(#titleFill)">
    FOOTBALL
  </text>
  <text x="251" y="174" font-size="34" font-family="Trebuchet MS, Verdana, sans-serif" font-weight="600" fill="#93c5fd" letter-spacing="4">
    DREAM LEAGUE XI
  </text>

  <circle cx="708" cy="52" r="9" fill="#22d3ee" opacity="0.9" />
  <circle cx="684" cy="212" r="7" fill="#84cc16" opacity="0.8" />
</svg>
